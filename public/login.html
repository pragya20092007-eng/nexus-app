<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Welcome Back</title>
    <style>
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #f8f9fa;
            --white: #ffffff;
            --text: #2d3436;
            --input-border: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; padding: 20px 0;
        }

        .login-card {
            background: var(--white);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            background: var(--primary);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: white;
            margin: 0 auto 20px;
            box-shadow: 0 8px 16px rgba(108, 92, 231, 0.2);
        }

        h2 { margin: 0 0 10px; color: var(--text); }
        p { color: #636e72; font-size: 0.9rem; margin-bottom: 30px; }

        .input-group {
            text-align: left;
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: #757575;
        }

        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
        }

        .btn-login {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn-login:hover {
            opacity: 0.9;
            transform: translateY(-2px);
        }

        .footer-links {
            margin-top: 25px;
            font-size: 0.85rem;
            color: #636e72;
        }

        .footer-links a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }
.user-avatar {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #6c5ce7; /* Nexus Purple */
    color: white;
    font-weight: bold;
    font-size: 1.2rem;
    text-transform: uppercase;
    border: 2px solid #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
}
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-logo">N</div>
    <h2>Welcome to Nexus</h2>
    <p>Log in to continue your growth journey.</p>

    <form id="loginForm">
        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@example.com" required>
        </div>

<div class="input-group" style="position: relative;">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required>
    <span id="togglePassword" style="position: absolute; right: 15px; top: 40px; cursor: pointer; font-size: 1.2rem;">
        👁️
    </span>
</div>

        <button type="submit" class="btn-login">Log In</button>
    </form>

    <div class="footer-links">
        Don't have an account? <a href="signup.html">Create one</a>
    </div>

<div id="error-message" style="color: red; display: none; margin-bottom: 15px; text-align: center;"></div>

</div>


<script>
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        const errorBox = document.getElementById('error-message');

        try {
            const response = await fetch('/api/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email, password })
            });

            const data = await response.json();

            if (response.ok) {
                localStorage.setItem('nexus_user', email);
                localStorage.setItem('nexus_name', data.name);
                localStorage.setItem('nexus_pic', data.pic);
                window.location.href = "index.html";
            } else {
                errorBox.textContent = data.message;
                errorBox.style.display = 'block';
            }
        } catch (error) {
            errorBox.textContent = "Server error. Is Node running?";
            errorBox.style.display = 'block';
        }
    });

const togglePassword = document.querySelector('#togglePassword');
const password = document.querySelector('#password');

togglePassword.addEventListener('click', function () {
    // Toggle the type attribute
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);
    
    // Toggle the icon
    this.textContent = type === 'password' ? '👁️' : '🙈';
});
</script>

</body>
</html>
