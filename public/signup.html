<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nexus | Join Us</title>
    <style>
        /* Reusing your exact styles for consistency */
        :root {
            --primary: #6c5ce7;
            --secondary: #a29bfe;
            --bg: #f8f9fa;
            --white: #ffffff;
            --text: #2d3436;
            --input-border: #dfe6e9;
        }

        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh; padding: 20px 0;
        }

        .login-card {
            background: var(--white);
            padding: 40px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.05);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        .brand-logo {
            width: 70px;
            height: 70px;
            background: var(--primary);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2rem;
            color: white;
            margin: 0 auto 20px;
            box-shadow: 0 8px 16px rgba(108, 92, 231, 0.2);
        }

        h2 { margin: 0 0 10px; color: var(--text); }
        p { color: #636e72; font-size: 0.9rem; margin-bottom: 30px; }

        .input-group { text-align: left; margin-bottom: 15px; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 8px; color: #757575; }
        
        input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid var(--input-border);
            border-radius: 12px;
            box-sizing: border-box;
            font-size: 1rem;
            transition: border-color 0.3s;
        }

        input:focus { outline: none; border-color: var(--primary); }

        .btn-signup {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.2s;
            margin-top: 10px;
        }

        .btn-signup:hover { opacity: 0.9; transform: translateY(-2px); }

        .footer-links { margin-top: 25px; font-size: 0.85rem; color: #636e72; }
        .footer-links a { color: var(--primary); text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>

<div class="login-card">
    <div class="brand-logo">N</div>
    <h2>Create Account</h2>
    <p>Start your personalized journey with Nexus.</p>

    <form id="signupForm">
        <div class="input-group">
            <label for="fullname">Full Name</label>
            <input type="text" id="fullname" placeholder="John Doe" required>
        </div>

        <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@example.com" required>
        </div>

        <div class="input-group" style="position: relative;">
    <label for="password">Password</label>
    <input type="password" id="password" placeholder="••••••••" required>
    <span id="togglePassword" style="position: absolute; right: 15px; top: 40px; cursor: pointer; font-size: 1.2rem;">
        👁️
    </span>
</div>

        <button type="submit" class="btn-signup">Create Account</button>
    </form>

    <div class="footer-links">
        Already have an account? <a href="login.html">Log In</a>
    </div>
</div>

<script>
    document.getElementById('signupForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const fullname = document.getElementById('fullname').value;
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;

        try {
            const response = await fetch('/api/signup', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ fullname, email, password })
            });

            const data = await response.json();

            if (response.ok) {
                alert("Account created successfully! Redirecting to login...");
                window.location.href = "login.html";
            } else {
                alert("Error: " + data.message);
            }
        } catch (error) {
            alert("Could not connect to the server. Make sure node server.js is running!");
        }
    });

const togglePassword = document.querySelector('#togglePassword');
const password = document.querySelector('#password');

togglePassword.addEventListener('click', function () {
    // Toggle the type attribute
    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
    password.setAttribute('type', type);
    
    // Toggle the icon
    this.textContent = type === 'password' ? '👁️' : '🙈';
});
</script>
</body>
</html>
